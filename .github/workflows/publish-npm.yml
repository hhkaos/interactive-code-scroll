name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish interactive-code-scroll
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./packages/interactive-code-scroll/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)." >&2
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Build package
        run: pnpm --filter interactive-code-scroll build

      - name: Smoke test package tarball
        run: pnpm test:pack

      - name: Select npm dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./packages/interactive-code-scroll/package.json').version")"
          if [[ "$version" == *-* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: packages/interactive-code-scroll
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"
