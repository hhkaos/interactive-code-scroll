<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Getting started preview</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- #region preview-card -->
    <main class="demo-card">
      <p class="eyebrow">Preview result</p>
      <!-- #region title-var -->
      <h1 id="title">My first tutorial</h1>
      <script>
        const demoTitle = "My first tutorial"; // @var demoTitle
        document.querySelector("#title").textContent = demoTitle;
      </script>
      <!-- #endregion title-var -->
      <p>This is the page your readers can open from the Preview tab.</p>
    </main>
    <!-- #endregion preview-card -->
  </body>
</html>
