<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">InteractiveCodeScroll authoring workflow</title>
  <desc id="desc">MDX, code and images become a static tutorial website.</desc>
  <rect width="960" height="540" fill="#f6f8fb" />
  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="130" width="190" height="130" rx="8" fill="#ffffff" stroke="#b7c4d1" />
    <text x="175" y="178" text-anchor="middle" font-size="28" font-weight="700" fill="#17202a">MDX</text>
    <text x="175" y="218" text-anchor="middle" font-size="18" fill="#4d5b68">Steps and fields</text>
    <rect x="80" y="300" width="190" height="110" rx="8" fill="#ffffff" stroke="#b7c4d1" />
    <text x="175" y="344" text-anchor="middle" font-size="26" font-weight="700" fill="#17202a">Code</text>
    <text x="175" y="380" text-anchor="middle" font-size="18" fill="#4d5b68">Runnable files</text>
    <path d="M300 270h132" stroke="#007ac2" stroke-width="8" stroke-linecap="round" />
    <path d="M430 246l48 24-48 24z" fill="#007ac2" />
    <rect x="500" y="190" width="210" height="150" rx="8" fill="#0b1f2a" />
    <text x="605" y="252" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Build</text>
    <text x="605" y="292" text-anchor="middle" font-size="18" fill="#b9dffc">Validate and render</text>
    <path d="M740 270h80" stroke="#007ac2" stroke-width="8" stroke-linecap="round" />
    <path d="M818 246l48 24-48 24z" fill="#007ac2" />
    <rect x="650" y="380" width="230" height="90" rx="8" fill="#ffffff" stroke="#b7c4d1" />
    <text x="765" y="416" text-anchor="middle" font-size="23" font-weight="700" fill="#17202a">Static site</text>
    <text x="765" y="448" text-anchor="middle" font-size="17" fill="#4d5b68">Docs, code and Preview</text>
  </g>
</svg>
